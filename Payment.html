<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Payment Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
           position: absolute;
           animation: inpaypage .5s ease;
            background-color: #c1cbec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .payment-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            position: relative;
           margin-top: -50px;
        }

        /* Back Button Style */
        .back-btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: #007bff;
        }

        .back-btn span {
            margin-right: 8px;
            font-size: 18px;
        }

        .payment-card h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3748;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background-color: #f8fafc;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #007bff;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }

        /* File Upload Input Style */
        .form-group input[type="file"] {
            padding: 8px;
            background-color: #fff;
            cursor: pointer;
        }

        /* Submit Button Style */
        .submit-btn {
           cursor: none;
           text-decoration: none;
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }
       @keyframes inpaypage {
          from {
             transform: translateX(-40px);
             opacity: 1;
          }
          to {
             transform: translateY(0);
             
          }
       }
    </style>
</head>
<body>

<div class="payment-card">
    <!-- Back Button -->
    <a href="home.html" class="back-btn" onclick="history.back()">
        <span>&#8592;</span> Back
    </a>

    <h2>Bank Payment Details</h2>
    
    <form action="/submit-payment" method="POST" enctype="multipart/form-data">
        
        <!-- 1. Full Name -->
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="full_name" placeholder="Enter your full name" required>
        </div>

        <!-- 2. Select Bank -->
        <div class="form-group">
            <label for="bankName">Select Bank</label>
            <select id="bankName" name="bank_name" required>
                <option value="" disabled selected>-- Choose Bank --</option>
                <option value="cbe">Commercial Bank of Ethiopia (CBE)</option>
                <option value="dashen">Dashen Bank</option>
                <option value="awash">Awash Bank</option>
                <option value="boa">Bank of Abyssinia</option>
                <option value="coop">Cooperative Bank of Oromia</option>
            </select>
        </div>

        <!-- 3. Account Number -->
        <div class="form-group">
            <label for="accountNumber">Account Number</label>
            <input type="text" id="accountNumber" name="account_number" placeholder="Enter account number" required>
        </div>

        <!-- 4. Amount -->
        <div class="form-group">
            <label for="amount">Amount Paid</label>
            <input type="number" id="amount" name="amount" min="1" step="0.01" placeholder="0.00" required>
        </div>

        <!-- 5. Transaction Reference ID -->
        <div class="form-group">
            <label for="transactionId">Transaction Reference / Ref No.</label>
            <input type="text" id="transactionId" name="transaction_id" placeholder="e.g. FT24010XXXXX" required>
        </div>

        <!-- 6. Receipt Upload -->
        <div class="form-group">
            <label for="receipt">Upload Payment Receipt</label>
            <input type="file" id="receipt" name="receipt_file" accept="image/*,.pdf" required>
        </div>
        <a href="done.html" class="submit-btn">Submit Payment</a>
    </form>
</div>

</body>
</html>
